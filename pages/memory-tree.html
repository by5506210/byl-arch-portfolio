<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Memory Tree &mdash; Bryan Youn</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://unpkg.com/@barba/core@2.10.3/dist/barba.umd.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/style.css?v=memory-tree-20260728c">
  <noscript><style>.moodboard-page{overflow:visible}.moodboard-split{display:none}.moodboard-page__grid{display:block}</style></noscript>
</head>
<body>
  <div class="grain"></div>
  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="memory-tree">
      <div class="moodboard-page memory-page">
        <header class="moodboard-page__header">
          <h1 class="moodboard-page__title">My Memory Tree</h1>
        </header>

        <div class="moodboard-split">
          <div class="moodboard-mindmap" data-moodboard-mindmap>
            <p class="moodboard-mindmap__hint">Hover or swipe to remember</p>
          </div>
          <aside class="moodboard-display" data-moodboard-display aria-live="polite">
            <img class="moodboard-display__img" alt="" decoding="async">
            <div class="moodboard-display__caption"></div>
          </aside>
        </div>

        <div class="moodboard-page__grid" aria-label="Childhood sketches">
          <figure class="moodboard-page__item" style="--i:0"
            data-theme="beginnings"
            data-desc="every landmark he knew, lined up on one street under the same sun &mdash; 2009">
            <img src="../assets/images/memory-tree/landmarks-2009.jpg" alt="Childhood marker drawing of world landmarks in a row" width="1621" height="1033" fetchpriority="high" decoding="async">
            <figcaption>2009</figcaption>
          </figure>
          <figure class="moodboard-page__item" style="--i:1"
            data-theme="imagined worlds"
            data-desc="a space museum ringed like saturn, star telescope and five star view tower included &mdash; 2013">
            <img src="../assets/images/memory-tree/space-museum-2013.jpg" alt="Childhood pencil sketch of a space museum with a Saturn-ring wing" width="1552" height="1036" loading="lazy" decoding="async">
            <figcaption>2013</figcaption>
          </figure>
          <figure class="moodboard-page__item" style="--i:2"
            data-theme="imagined worlds"
            data-desc="villa cross, drawn in side view, top view, and floor plans with a glass wall legend &mdash; 2013">
            <img src="../assets/images/memory-tree/villa-cross-2013.jpg" alt="Childhood sketch of Villa Cross with annotated plans and views" width="1459" height="1033" loading="lazy" decoding="async">
            <figcaption>2013</figcaption>
          </figure>
          <figure class="moodboard-page__item" style="--i:3"
            data-theme="imagined worlds"
            data-desc="sky fortress, ten floors and four bridges strung between two towers &mdash; 2014">
            <img src="../assets/images/memory-tree/sky-fortress-2014.jpg" alt="Childhood sketch of twin towers joined by sky bridges" width="1473" height="1039" loading="lazy" decoding="async">
            <figcaption>2014</figcaption>
          </figure>
          <figure class="moodboard-page__item" style="--i:4"
            data-theme="imagined worlds"
            data-desc="karma sky, a spiral tower stacked with hotels, a mall, and its own top view &mdash; 2014">
            <img src="../assets/images/memory-tree/spiral-tower-2014.jpg" alt="Childhood sketch of the Karma Sky spiral tower complex" width="1440" height="1038" loading="lazy" decoding="async">
            <figcaption>2014</figcaption>
          </figure>
          <figure class="moodboard-page__item" style="--i:5"
            data-theme="first houses"
            data-desc="five house, flat roofs and deep shadows in two-point perspective &mdash; 2019">
            <img src="../assets/images/memory-tree/five-house-2019.jpg" alt="Pencil perspective drawing of a flat-roofed modern house" width="1440" height="1080" loading="lazy" decoding="async">
            <figcaption>2019</figcaption>
          </figure>
          <figure class="moodboard-page__item" style="--i:6"
            data-theme="first houses"
            data-desc="cube house, boxes stacked and carved around one tall core &mdash; 2020">
            <img src="../assets/images/memory-tree/cube-house-2020.jpg" alt="Pencil drawing of a cubic house massed around a central tower" width="1080" height="1440" loading="lazy" decoding="async">
            <figcaption>2020</figcaption>
          </figure>
          <figure class="moodboard-page__item" style="--i:7"
            data-theme="first houses"
            data-desc="manoir de la foret, a long low manor with a stair climbing through its heart &mdash; 2020">
            <img src="../assets/images/memory-tree/manoir-de-la-foret-2020.jpg" alt="Pencil drawing of a low horizontal manor with an open stair" width="1440" height="1082" loading="lazy" decoding="async">
            <figcaption>2020</figcaption>
          </figure>
        </div>
      </div>
    </main>
  </div>
  <script src="../src/js/cursor.js?v=memory-tree-20260728c" defer></script>
  <script src="../src/js/project-page.js?v=memory-tree-20260728c" defer></script>
  <script src="../src/js/transitions.js?v=memory-tree-20260728c" defer></script>
  <script src="../src/js/moodboard-tree.js?v=moodboard-biggertree-20260601k" defer></script>
</body>
</html>
