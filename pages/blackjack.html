<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table - Bryan Youn</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://unpkg.com/@barba/core@2.10.3/dist/barba.umd.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/style.css?v=trace-reveal-20260810c">
</head>
<body>
  <div class="grain"></div>
  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="blackjack">
      <section class="blackjack-page" data-blackjack-game>
        <div class="blackjack-intro" id="blackjack-intro" aria-hidden="true" style="position:fixed;inset:0;z-index:75;background:#060605;"><span class="blackjack-intro__spot"></span></div>
        <nav class="blackjack-nav" aria-label="Blackjack navigation">
          <a href="../index.html" class="blackjack-nav__brand" data-barba-prevent="self">BYL</a>
          <div class="blackjack-nav__links">
            <a href="projects.html" data-barba-prevent="self">Projects</a>
            <a href="about.html" class="nav-qmark" data-barba-prevent="self" aria-label="About">?</a>
          </div>
        </nav>

        <div class="blackjack-shell">
          <header class="blackjack-header" aria-label="Blackjack status">
            <span class="blackjack-header__round" id="blackjack-round">Round 1/3</span>
            <span class="blackjack-header__status" id="blackjack-message" aria-live="polite">Place your bet</span>
            <span class="blackjack-header__chips">Chips <strong id="blackjack-chips">100</strong></span>
          </header>

          <div class="blackjack-layout">
            <section class="blackjack-table" aria-label="Blackjack table">
              <div class="blackjack-table__felt">
                <div class="blackjack-seat blackjack-seat--dealer">
                  <div class="blackjack-seat__topline">
                    <span class="blackjack-seat__name">Dealer</span>
                    <span class="blackjack-seat__value" id="blackjack-dealer-value">0</span>
                  </div>
                  <div class="blackjack-hand" id="blackjack-dealer-hand" aria-label="Dealer hand"></div>
                </div>

                <div class="blackjack-seat blackjack-seat--ghost">
                  <div class="blackjack-seat__topline">
                    <span class="blackjack-seat__name">Ghost Bryan</span>
                  </div>
                  <div class="blackjack-hand blackjack-hand--small" id="blackjack-cpu-hand" aria-label="Ghost Bryan hand"></div>
                  <p class="blackjack-seat__quip" id="blackjack-ghost-quip" aria-live="polite"></p>
                </div>

                <div class="blackjack-seat blackjack-seat--player">
                  <div class="blackjack-seat__topline">
                    <span class="blackjack-seat__name">You</span>
                    <span class="blackjack-seat__value" id="blackjack-player-value">0</span>
                  </div>
                  <div class="blackjack-hand" id="blackjack-player-hand" aria-label="Your hand"></div>
                </div>

                <div class="blackjack-result" id="blackjack-result" aria-live="polite" aria-atomic="true"></div>
              </div>
            </section>

            <aside class="blackjack-controls" aria-label="Blackjack controls">
              <div class="blackjack-controls__left">
                <div class="blackjack-panel blackjack-panel--wager" data-blackjack-panel="wager">
                  <span class="blackjack-wager__label">Bet</span>
                  <div class="blackjack-wager">
                    <button type="button" class="blackjack-icon-button" data-bet-step="-10" aria-label="Lower bet">-</button>
                    <div>
                      <strong id="blackjack-wager-display">10</strong>
                    </div>
                    <button type="button" class="blackjack-icon-button" data-bet-step="10" aria-label="Raise bet">+</button>
                  </div>
                </div>
              </div>

              <button type="button" id="blackjack-deal" class="blackjack-primary-action">Deal</button>

              <div class="blackjack-panel blackjack-panel--actions is-hidden" data-blackjack-panel="actions">
                <div class="blackjack-actions">
                  <button type="button" id="blackjack-hit" disabled>Hit</button>
                  <button type="button" id="blackjack-stand" disabled>Stand</button>
                  <button type="button" id="blackjack-double" aria-label="Double down" disabled>Double</button>
                </div>
              </div>
            </aside>
          </div>
        </div>

        <div class="blackjack-game-over" id="blackjack-game-over" aria-live="polite" aria-modal="true" aria-hidden="true" role="dialog">
          <div class="blackjack-game-over__panel">
            <span>Final</span>
            <strong id="blackjack-final-title">You win</strong>
            <small id="blackjack-final-detail">100 chips</small>
            <div class="blackjack-game-over__actions">
              <a href="about.html" data-barba-prevent="self">Go Back</a>
              <button type="button" id="blackjack-play-again">Play Again</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../src/js/cursor.js?v=memory-gallery-20260728d" defer></script>
  <script src="../src/js/blackjack.js?v=blackjack-room-flesh-20260531b" defer></script>
  <script src="../src/js/transitions.js?v=memory-gallery-20260728d" defer></script>
  <script src="../src/js/moodboard-tree.js?v=moodboard-biggertree-20260601k" defer></script>
</body>
</html>
